[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floatpen"
version = "1.0.0"
description = "Floating desktop marker and screen annotation tool for Linux like Epic Pen"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Khitish Nayak", email = "kknayak049@gmail.com" }
]
keywords = [
    "screen-annotation",
    "desktop-marker",
    "epic-pen",
    "floatpen",
    "linux",
    "whiteboard",
    "presentation",
    "screen-draw",
    "cairo",
    "gtk3"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "pycairo>=1.20.0",
    "PyGObject>=3.40.0",
]

[project.urls]
Homepage = "https://github.com/Khitishnayak/floatpen"
Repository = "https://github.com/Khitishnayak/floatpen.git"
Issues = "https://github.com/Khitishnayak/floatpen/issues"

[project.scripts]
floatpen = "floatpen.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["floatpen*"]

[tool.setuptools.package-data]
floatpen = ["*.css"]
