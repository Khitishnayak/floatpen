name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-gi python3-gi-cairo gir1.2-gtk-3.0 libcairo2-dev libx11-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pycairo PyGObject flake8

    - name: Lint with flake8
      run: |
        flake8 epicmarker tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run unit tests under Xvfb
      run: |
        xvfb-run -a python -m unittest discover -s tests -v
