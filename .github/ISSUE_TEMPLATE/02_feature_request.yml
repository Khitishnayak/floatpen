name: "✨ Feature Request"
description: Propose a new feature, drawing tool, shape, or UI enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make FloatPen better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: Is your feature request related to a problem or specific presentation/teaching scenario?
      placeholder: e.g. "When giving technical presentations, I often need to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision the feature working in FloatPen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you seen this implemented in other tools (e.g. Epic Pen, Draw on Screen, Flameshot)?
  - type: checkboxes
    id: contribution
    attributes:
      label: Would you like to contribute this feature?
      options:
        - label: I would be interested in submitting a Pull Request for this!
