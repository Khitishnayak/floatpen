name: "🐛 Bug Report"
description: File a bug report to help us improve FloatPen
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: os_info
    attributes:
      label: Operating System & Desktop
      description: Run `echo "$XDG_CURRENT_DESKTOP ($XDG_SESSION_TYPE)"` on Linux or specify OS version
      placeholder: e.g. Ubuntu 24.04 GNOME (Wayland) / Fedora 40 KDE / Windows 11 / macOS Sonoma
    validations:
      required: true
  - type: input
    id: floatpen_version
    attributes:
      label: FloatPen Version / Installation Method
      description: e.g. v1.0.1 (.deb package) / Source git clone / Snap / Wheel
      placeholder: e.g. v1.0.1 (.deb)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        1. Launch FloatPen (`floatpen`)
        2. Click on ...
        3. Draw ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Traceback
      description: Paste any terminal output or error tracebacks here.
      render: shell
