name: floatpen
base: core24
version: '1.0.0'
summary: Floating desktop marker and screen annotation tool like Epic Pen
description: |
  FloatPen is a lightweight, responsive desktop marker and screen annotation
  tool for Linux. It allows drawing, highlighting, placing arrows and shapes,
  and writing text notes directly over any live application, desktop, video player,
  or browser with instant click-through toggling.

  Key Features:
  - Instant Click-Through Pointer Mode (annotate while interacting with apps)
  - Vector Pen with smooth Bezier curves
  - Translucent Highlighter, Eraser, Line, Arrow, Rectangle, Circle, and Text
  - Instant Whiteboard & Blackboard digital boards
  - Global hotkeys (Alt+D, Ctrl+Shift+A, F8)
  - One-click screenshot capture and clipboard copy

grade: stable
confinement: strict

apps:
  floatpen:
    command: usr/bin/floatpen
    desktop: usr/share/applications/floatpen.desktop
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - home

parts:
  floatpen:
    plugin: dump
    source: .
    stage-packages:
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-3.0
      - libcairo2
      - libx11-6
    override-build: |
      craftctl default
      install -d $CRAFT_PART_INSTALL/usr/bin
      install -d $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/floatpen
      install -d $CRAFT_PART_INSTALL/usr/share/applications
      install -d $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps

      cp -r floatpen/* $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/floatpen/
      cp assets/floatpen.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/floatpen.png

      cat << 'EOF' > $CRAFT_PART_INSTALL/usr/bin/floatpen
      #!/usr/bin/env bash
      if [ -n "$WAYLAND_DISPLAY" ] && [ -z "$GDK_BACKEND" ]; then
          export GDK_BACKEND=x11
      fi
      exec python3 -m floatpen.main "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/usr/bin/floatpen

      cat << 'EOF' > $CRAFT_PART_INSTALL/usr/share/applications/floatpen.desktop
      [Desktop Entry]
      Name=FloatPen
      Comment=Floating desktop marker and screen annotation tool like Epic Pen
      Exec=floatpen
      Icon=/usr/share/icons/hicolor/256x256/apps/floatpen.png
      Terminal=false
      Type=Application
      Categories=Utility;Graphics;
      Keywords=screen;marker;draw;pen;epic;annotation;presentation;whiteboard;floating;
      StartupNotify=true
      EOF
